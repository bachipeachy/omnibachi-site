<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 340" width="1020" height="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1020" height="340" fill="#ffffff"/>
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b00"/>
    </marker>
  </defs>

  <!-- path A -->
  <text x="20" y="42" font-size="13" font-weight="bold">first registration</text>
  <text x="20" y="60" font-size="11" fill="#555">path 3 of 8</text>

  <g font-size="11">
    <rect x="175" y="22" width="120" height="46" fill="#dbe9f5" stroke="#111"/>
    <text x="235" y="43" font-size="11" text-anchor="middle">IN_ACTOR_</text>
    <text x="235" y="58" font-size="11" text-anchor="middle">REGISTERED</text>

    <rect x="325" y="22" width="120" height="46" fill="#d9efd9" stroke="#111"/>
    <text x="385" y="43" font-size="11" text-anchor="middle">CC_VALIDATE_</text>
    <text x="385" y="58" font-size="11" text-anchor="middle">REGISTRATION</text>

    <rect x="475" y="22" width="120" height="46" fill="#d9efd9" stroke="#111"/>
    <text x="535" y="43" font-size="11" text-anchor="middle">CC_CLAIM_</text>
    <text x="535" y="58" font-size="11" text-anchor="middle">CONTACT_ADDRESS</text>

    <rect x="625" y="22" width="120" height="46" fill="#d9efd9" stroke="#111"/>
    <text x="685" y="43" font-size="11" text-anchor="middle">CC_REGISTER_</text>
    <text x="685" y="58" font-size="11" text-anchor="middle">ACTOR</text>

    <rect x="775" y="22" width="120" height="46" fill="#d9efd9" stroke="#111"/>
    <text x="835" y="43" font-size="11" text-anchor="middle">CC_APPEND_ACTOR_</text>
    <text x="835" y="58" font-size="11" text-anchor="middle">OCCURRENCE</text>

    <ellipse cx="955" cy="45" rx="52" ry="23" fill="#f5d9d9" stroke="#111"/>
    <text x="955" y="49" font-size="11" text-anchor="middle">EXIT_SUCCESS</text>
  </g>
  <g stroke="#b00" stroke-width="2" marker-end="url(#e)">
    <line x1="295" y1="45" x2="321" y2="45"/>
    <line x1="445" y1="45" x2="471" y2="45"/>
    <line x1="595" y1="45" x2="621" y2="45"/>
    <line x1="745" y1="45" x2="771" y2="45"/>
    <line x1="895" y1="45" x2="901" y2="45"/>
  </g>
  <g font-size="9" fill="#b00" text-anchor="middle">
    <text x="308" y="18">ACK</text>
    <text x="458" y="18">SUCCESS</text>
    <text x="608" y="18">SUCCESS</text>
    <text x="758" y="18">SUCCESS</text>
    <text x="898" y="18">SUCCESS</text>
  </g>
  <g font-size="9" fill="#444" text-anchor="middle">
    <text x="385" y="86">CT validate</text>
    <text x="535" y="86">CT extract · CS registry</text>
    <text x="685" y="86">CT assemble · CS json</text>
    <text x="835" y="86">CS clock · CT · CS append</text>
    <text x="955" y="86">emits EV</text>
  </g>

  <line x1="20" y1="115" x2="1000" y2="115" stroke="#ccc"/>

  <!-- path B -->
  <text x="20" y="162" font-size="13" font-weight="bold">contact address</text>
  <text x="20" y="180" font-size="13" font-weight="bold">already claimed</text>
  <text x="20" y="198" font-size="11" fill="#555">path 1 of 8</text>

  <g font-size="11">
    <rect x="175" y="142" width="120" height="46" fill="#dbe9f5" stroke="#111"/>
    <text x="235" y="163" font-size="11" text-anchor="middle">IN_ACTOR_</text>
    <text x="235" y="178" font-size="11" text-anchor="middle">REGISTERED</text>

    <rect x="325" y="142" width="120" height="46" fill="#d9efd9" stroke="#111"/>
    <text x="385" y="163" font-size="11" text-anchor="middle">CC_VALIDATE_</text>
    <text x="385" y="178" font-size="11" text-anchor="middle">REGISTRATION</text>

    <rect x="475" y="142" width="120" height="46" fill="#d9efd9" stroke="#111"/>
    <text x="535" y="163" font-size="11" text-anchor="middle">CC_CLAIM_</text>
    <text x="535" y="178" font-size="11" text-anchor="middle">CONTACT_ADDRESS</text>

    <rect x="625" y="142" width="120" height="46" fill="#f2f2f2" stroke="#999" stroke-dasharray="4 3"/>
    <text x="685" y="163" font-size="11" fill="#999" text-anchor="middle">CC_REGISTER_</text>
    <text x="685" y="178" font-size="11" fill="#999" text-anchor="middle">ACTOR</text>

    <rect x="775" y="142" width="120" height="46" fill="#d9efd9" stroke="#111"/>
    <text x="835" y="163" font-size="11" text-anchor="middle">CC_APPEND_ACTOR_</text>
    <text x="835" y="178" font-size="11" text-anchor="middle">OCCURRENCE</text>

    <ellipse cx="955" cy="165" rx="52" ry="23" fill="#f5d9d9" stroke="#111"/>
    <text x="955" y="169" font-size="11" text-anchor="middle">EXIT_SUCCESS</text>
  </g>
  <g stroke="#b00" stroke-width="2" marker-end="url(#e)">
    <line x1="295" y1="165" x2="321" y2="165"/>
    <line x1="445" y1="165" x2="471" y2="165"/>
    <line x1="895" y1="165" x2="901" y2="165"/>
  </g>
  <path d="M 570 142 C 600 105, 700 105, 800 138" fill="none" stroke="#b00" stroke-width="2" marker-end="url(#e)"/>
  <text x="685" y="106" font-size="9" fill="#b00" text-anchor="middle">ALREADY_EXISTS</text>
  <g font-size="9" fill="#b00" text-anchor="middle">
    <text x="308" y="138">ACK</text>
    <text x="458" y="138">SUCCESS</text>
    <text x="898" y="138">SUCCESS</text>
  </g>
  <text x="685" y="206" font-size="9" fill="#999" text-anchor="middle">not traversed</text>

  <text x="510" y="262" font-size="12" font-style="italic" text-anchor="middle">Both paths were determined at compile time. The runtime chose between them by reading an outcome code off the graph.</text>
  <text x="510" y="288" font-size="12" font-style="italic" text-anchor="middle">Six further paths reach EXIT_REJECTED. Eight is the whole behavioral surface of this workflow — there is no ninth.</text>
</svg>
