<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t4 d4">
<title id="t4">Closed-loop governed transformation</title>
<desc id="d4">A named predecessor baseline and a stated purpose enter a governed transformation, which yields a successor baseline or a stated finding. At genesis the input is the empty governed state, which relaxes no obligation.</desc>
<defs><style>.title{font:700 34px Georgia,serif;fill:#173b37}.subtitle{font:400 21px Arial,sans-serif;fill:#46615c}.section{font:700 17px Arial,sans-serif;letter-spacing:2px;fill:#52736d}.head{font:700 27px Arial,sans-serif;fill:#173b37}.body{font:400 19px Arial,sans-serif;fill:#35534e}.note{font:400 18px Arial,sans-serif;fill:#58736e}.box{stroke:#b6cbc5;stroke-width:3}.line{fill:none;stroke:#24655d;stroke-width:5;marker-end:url(#a)}.loop{fill:none;stroke:#bd8d1c;stroke-width:5;stroke-dasharray:14 10;marker-end:url(#g)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#24655d" stroke-width="1.5"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#bd8d1c" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="620" fill="#f7faf8"/>
<text x="80" y="72" class="section">TRANSFORMATION</text>
<text x="80" y="130" class="title">The baseline is a party to its own transformation.</text>
<text x="80" y="170" class="subtitle">Not context for the change — the predecessor whose identity must be accounted for.</text>
<rect x="90" y="250" width="290" height="140" rx="18" fill="#e4efec" class="box"/>
<text x="235" y="298" text-anchor="middle" class="head">Baseline S</text>
<text x="235" y="333" text-anchor="middle" class="body">named and frozen</text>
<text x="235" y="365" text-anchor="middle" class="note">+ stated purpose π</text>
<rect x="455" y="250" width="290" height="140" rx="18" fill="#173b37"/>
<text x="600" y="296" text-anchor="middle" style="font:700 25px Arial,sans-serif;fill:#fff">governed</text>
<text x="600" y="330" text-anchor="middle" style="font:700 25px Arial,sans-serif;fill:#fff">transformation</text>
<text x="600" y="366" text-anchor="middle" style="font:400 17px Arial,sans-serif;fill:#e8f0ee">phases · rules · projections</text>
<rect x="820" y="250" width="290" height="140" rx="18" fill="#e4efec" class="box"/>
<text x="965" y="298" text-anchor="middle" class="head">Successor S′</text>
<text x="965" y="333" text-anchor="middle" class="body">or a stated finding</text>
<text x="965" y="365" text-anchor="middle" class="note">at a named phase</text>
<path d="M390 320H445" class="line"/><path d="M755 320H810" class="line"/>
<path d="M965 405C965 500 235 500 235 405" class="loop"/>
<text x="600" y="545" text-anchor="middle" class="body">The function is partial: not every problem yields a successor. The process is total: every failure yields a finding.</text>
<text x="600" y="585" text-anchor="middle" class="note">At genesis the input is the empty governed state. Genesis relaxes no obligation.</text>
</svg>
