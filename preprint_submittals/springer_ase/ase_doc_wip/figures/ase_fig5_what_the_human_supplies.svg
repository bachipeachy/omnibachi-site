<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 596" width="576" height="596"
     font-family="Helvetica, Arial, sans-serif">
  <rect width="576" height="596" fill="#ffffff"/>
  <defs>
    <marker id="i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
  </defs>
  <g fill="#1a1a1a">

  <text x="28" y="30" font-size="10.5" letter-spacing="0.9" fill="#444">FOUR INPUTS BEFORE THE AGENT ACTS — THREE ESTABLISHED, ONE INHERITED</text>

  <!-- column heads -->
  <text x="46" y="62" font-size="10.5" letter-spacing="1.2" fill="#888">THE HUMAN SUPPLIES</text>
  <text x="330" y="62" font-size="10.5" letter-spacing="1.2" fill="#888">WHICH FIXES</text>
  <line x1="28" y1="70" x2="548" y2="70" stroke="#c9c9c9"/>

  <!-- 1 scope -->
  <circle cx="46" cy="96" r="6.5" fill="#1a1a1a"/>
  <text x="64" y="93" font-size="12.5" font-weight="bold">scope</text>
  <text x="64" y="110" font-size="10" fill="#666">human act 1 of 3</text>
  <line x1="252" y1="96" x2="300" y2="96" stroke="#1a1a1a" marker-end="url(#i)"/>
  <text x="312" y="93" font-size="11.5">what system is governed</text>
  <text x="312" y="109" font-size="10.5" fill="#666">and which parts of the standard apply</text>

  <!-- 2 profile -->
  <circle cx="46" cy="160" r="6.5" fill="#1a1a1a"/>
  <text x="64" y="157" font-size="12.5" font-weight="bold">normative profile</text>
  <text x="64" y="174" font-size="10" fill="#666">human act 2 of 3 — the scope, in the form the standard specifies</text>
  <line x1="252" y1="160" x2="300" y2="160" stroke="#1a1a1a" marker-end="url(#i)"/>
  <text x="312" y="157" font-size="11.5">the selection among the standard's options,</text>
  <text x="312" y="173" font-size="11.5">together with what it excludes</text>

  <!-- the rule -->
  <rect x="64" y="188" width="468" height="30" fill="#1a1a1a"/>
  <text x="298" y="208" text-anchor="middle" font-size="11.5" fill="#ffffff">the profile must not be authored by the system it governs</text>
  <text x="64" y="234" font-size="10.5" fill="#666">Otherwise a system could choose its own governing rules and then claim conformance to them.</text>

  <!-- 3 business problem -->
  <circle cx="46" cy="278" r="6.5" fill="#1a1a1a"/>
  <text x="64" y="275" font-size="12.5" font-weight="bold">business problem</text>
  <text x="64" y="292" font-size="10" fill="#666">human act 3 of 3 — plain language</text>
  <line x1="252" y1="278" x2="300" y2="278" stroke="#1a1a1a" marker-end="url(#i)"/>
  <text x="312" y="275" font-size="11.5">what change is sought</text>
  <text x="312" y="291" font-size="10.5" fill="#666">the input P0 takes as a change seed</text>

  <!-- 4 baseline -->
  <rect x="39" y="333" width="14" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="64" y="339" font-size="12.5" font-weight="bold">baseline #n</text>
  <text x="64" y="356" font-size="10" fill="#666">not supplied — carried forward by the previous cycle</text>
  <line x1="252" y1="340" x2="300" y2="340" stroke="#1a1a1a" marker-end="url(#i)"/>
  <text x="312" y="337" font-size="11.5">the state the transformation transforms</text>
  <text x="312" y="353" font-size="10.5" fill="#666">read through the inspector, never written to</text>

  <!-- what the agent establishes -->
  <line x1="28" y1="392" x2="548" y2="392" stroke="#c9c9c9"/>
  <rect x="28" y="408" width="520" height="52" fill="#fafafa" stroke="#1a1a1a" stroke-dasharray="6 4"/>
  <text x="46" y="430" font-size="12">The agent establishes none of these.</text>
  <text x="46" y="450" font-size="10.5" fill="#666">It may author the profile document to the human's scope decision; it may not decide the scope.</text>

  <!-- consequence -->
  <line x1="28" y1="486" x2="548" y2="486" stroke="#c9c9c9"/>
  <text x="28" y="510" font-size="11.5" letter-spacing="1.2" fill="#444">WHY SCOPE AND NOT DESIGN</text>
  <text x="44" y="536" font-size="12">What to govern is the decision that cannot be delegated to the system being</text>
  <text x="44" y="552" font-size="12">governed without making its governing authority self-referential.</text>
  <text x="44" y="578" font-size="10.5" fill="#666">Everything downstream of these four is derivable. None of it is authorization.</text>
  </g>
</svg>
