<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 752" width="576" height="752"
     font-family="Helvetica, Arial, sans-serif">
  <rect width="576" height="752" fill="#ffffff"/>
  <defs>
    <marker id="q" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
    <marker id="qs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker>
  </defs>
  <g fill="#1a1a1a">

  <text x="28" y="26" font-size="11.5" letter-spacing="1.4" fill="#444">EIGHT CONCERNS — AND WHAT EACH PHASE IS JUDGED AGAINST</text>
  <text x="28" y="42" font-size="10" fill="#666">arrows are declared priors, read from each phase's rule set — not a processing order</text>

  <!-- P0 -->
  <rect x="196" y="58" width="184" height="42" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="288" y="76" text-anchor="middle" font-size="12" font-weight="bold">P0 · Change Seed</text>
  <text x="288" y="91" text-anchor="middle" font-size="9.5" fill="#555">the stated problem · 20 registers · 3 rules</text>
  <text x="396" y="82" font-size="9.5" fill="#888">problem concern</text>

  <!-- split -->
  <path d="M240,102 L240,124 L104,124 L104,146" fill="none" stroke="#1a1a1a" marker-end="url(#q)"/>
  <path d="M336,102 L336,124 L448,124 L448,146" fill="none" stroke="#1a1a1a" marker-end="url(#q)"/>
  <text x="172" y="119" text-anchor="middle" font-size="9" fill="#888">verify</text>
  <text x="392" y="119" text-anchor="middle" font-size="9" fill="#888">intend</text>

  <!-- ===== LEFT: modelling branch ===== -->
  <text x="28" y="160" font-size="10" letter-spacing="1.2" fill="#888">MODELLING BRANCH</text>
  <rect x="28" y="176" width="152" height="220" fill="#fafafa" stroke="#d8d8d8"/>
  <g font-size="10.5" text-anchor="middle">
    <rect x="40" y="188" width="128" height="38" fill="#ffffff" stroke="#1a1a1a"/>
    <text x="104" y="204" font-weight="bold" font-size="10">P1 Change Request</text>
    <text x="104" y="218" font-size="8.5" fill="#666">19 reg · 3 rules</text>
    <rect x="40" y="240" width="128" height="38" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="104" y="256" font-weight="bold" font-size="10">P2 Domain Model</text>
    <text x="104" y="270" font-size="8.5" fill="#666">8 reg · 5 rules</text>
    <rect x="40" y="292" width="128" height="38" fill="#ffffff" stroke="#1a1a1a"/>
    <text x="104" y="308" font-weight="bold" font-size="10">P3 Analysis Loop</text>
    <text x="104" y="322" font-size="8.5" fill="#666">7 reg · 10 rules</text>
    <rect x="40" y="344" width="128" height="38" fill="#ffffff" stroke="#1a1a1a"/>
    <text x="104" y="360" font-weight="bold" font-size="10">P4 Business Model</text>
    <text x="104" y="374" font-size="8.5" fill="#666">7 reg · 8 rules</text>
  </g>
  <g stroke="#1a1a1a">
    <line x1="104" y1="228" x2="104" y2="236" marker-end="url(#q)"/>
    <line x1="104" y1="280" x2="104" y2="288" marker-end="url(#q)"/>
    <line x1="104" y1="332" x2="104" y2="340" marker-end="url(#q)"/>
  </g>
  <text x="176" y="262" font-size="8.5" fill="#333">grounding</text>
  <text x="176" y="273" font-size="8.5" fill="#666">boundary</text>
  <text x="104" y="412" text-anchor="middle" font-size="9" fill="#666">no phase declares P4 a prior —</text>
  <text x="104" y="424" text-anchor="middle" font-size="9" fill="#666">the branch verifies, it does not</text>
  <text x="104" y="436" text-anchor="middle" font-size="9" fill="#666">hand a design forward</text>

  <!-- ===== RIGHT: intent branch ===== -->
  <text x="300" y="160" font-size="10" letter-spacing="1.2" fill="#888">INTENT BRANCH</text>
  <rect x="300" y="176" width="248" height="272" fill="#ffffff" stroke="#1a1a1a"/>
  <g text-anchor="middle">
    <rect x="330" y="188" width="150" height="38" fill="#ffffff" stroke="#1a1a1a"/>
    <text x="405" y="204" font-weight="bold" font-size="10">P5 Business Intent</text>
    <text x="405" y="218" font-size="8.5" fill="#666">8 reg · 12 rules</text>
    <rect x="330" y="252" width="150" height="38" fill="#ffffff" stroke="#1a1a1a"/>
    <text x="405" y="268" font-weight="bold" font-size="10">P6 Governance Intent</text>
    <text x="405" y="282" font-size="8.5" fill="#666">6 reg · 11 rules</text>
    <rect x="330" y="316" width="150" height="42" fill="#f7f7f7" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="405" y="332" font-weight="bold" font-size="10">P7 Design Intent</text>
    <text x="405" y="346" font-size="8.5" fill="#666">20 reg · <tspan font-weight="bold">70 rules</tspan></text>
    <rect x="330" y="384" width="150" height="38" fill="#ffffff" stroke="#1a1a1a"/>
    <text x="405" y="400" font-weight="bold" font-size="10">P8 Authoring Mandate</text>
    <text x="405" y="414" font-size="8.5" fill="#666">7 reg · 12 rules</text>
  </g>
  <g stroke="#1a1a1a">
    <line x1="405" y1="228" x2="405" y2="248" marker-end="url(#q)"/>
    <line x1="405" y1="292" x2="405" y2="312" marker-end="url(#q)"/>
    <line x1="405" y1="360" x2="405" y2="380" marker-end="url(#q)"/>
  </g>
  <text x="492" y="306" font-size="8.5" fill="#333">discharge</text>
  <text x="492" y="374" font-size="8.5" fill="#666">schedule</text>

  <!-- P0 cited directly by P5, P6, P7 -->
  <path d="M312,207 L312,207" fill="none"/>
  <path d="M252,102 L252,172 L312,172 L312,207 L328,207" fill="none" stroke="#777" stroke-dasharray="4 3" marker-end="url(#qs)"/>
  <path d="M312,172 L312,271 L328,271" fill="none" stroke="#777" stroke-dasharray="4 3" marker-end="url(#qs)"/>
  <path d="M312,172 L312,337 L328,337" fill="none" stroke="#777" stroke-dasharray="4 3" marker-end="url(#qs)"/>
  <text x="306" y="440" font-size="9" fill="#555" font-style="italic">P0 is cited directly by P5, P6 and P7</text>

  <!-- why -->
  <line x1="28" y1="474" x2="548" y2="474" stroke="#c9c9c9"/>
  <text x="28" y="492" font-size="10.5" letter-spacing="1.1" fill="#444">WHY THE SEED IS CITED, NOT CARRIED</text>
  <text x="44" y="510" font-size="10" fill="#333">Carrying the seed forward would mean a register and a carry rule in each intermediate phase,</text>
  <text x="44" y="523" font-size="10" fill="#333">restating what the seed already says — and free to drift from it. P5 reads the seed so a substituted</text>
  <text x="44" y="536" font-size="10" fill="#333">subdomain purpose has to be declared; P6 reads it because the span of a change is whatever the</text>
  <text x="44" y="549" font-size="10" fill="#333">seed's classifications name, and an unowned touched subdomain must be caught.</text>

  <line x1="28" y1="566" x2="548" y2="566" stroke="#c9c9c9"/>
  <text x="28" y="586" font-size="10.5" letter-spacing="1.1" fill="#444">WHAT THE DECLARED STRUCTURE RECORDS</text>
  <g font-size="10">
    <text x="44" y="606">·  no intent phase declares an analysis phase as a prior — a declared property, not a closed input surface</text>
    <text x="44" y="624">·  a later phase declares which earlier concerns it consumes, and the citation is checked</text>
    <text x="44" y="642">·  P7 declares P6 as a prior and carries its refusal discharge — design cannot precede permission</text>
    <text x="44" y="660">·  P8 reconciles with P7 exactly — the mandate orders the design rather than restating it</text>
  </g>

  <line x1="28" y1="680" x2="548" y2="680" stroke="#c9c9c9"/>
  <text x="28" y="700" font-size="11" font-style="italic">The agent may perform the reasoning in every phase; no phase grants it authority to</text>
  <text x="28" y="715" font-size="11" font-style="italic">redefine the concern an earlier phase established.</text>
  <text x="28" y="732" font-size="9" fill="#666">Register and rule counts read from the templates and each phase&#8217;s rule set at the pinned</text>
  <text x="28" y="743" font-size="9" fill="#666">revision. Counts describe size, not importance.</text>
  </g>
</svg>
