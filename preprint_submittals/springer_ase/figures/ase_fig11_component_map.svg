<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 744" width="576" height="744"
     font-family="Helvetica, Arial, sans-serif">
  <rect width="576" height="744" fill="#ffffff"/>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
  </defs>
  <g fill="#1a1a1a">

  <text x="28" y="28" font-size="11.5" letter-spacing="1.4" fill="#444">IMPLEMENTATION COMPONENTS AND ARTIFACT FLOW</text>

  <text x="46" y="56" font-size="10" letter-spacing="1.2" fill="#888">ARTIFACT</text>
  <text x="250" y="56" font-size="10" letter-spacing="1.2" fill="#888">COMPONENT · DISTRIBUTION</text>
  <text x="452" y="56" font-size="10" letter-spacing="1.2" fill="#888">DETERMINES</text>
  <line x1="28" y1="64" x2="548" y2="64" stroke="#c9c9c9"/>

  <!-- declarations -->
  <rect x="34" y="76" width="170" height="40" fill="#f0f0f0" stroke="#1a1a1a"/>
  <text x="119" y="94" text-anchor="middle" font-size="11">governed declarations</text>
  <text x="119" y="108" text-anchor="middle" font-size="8.5" fill="#666">registry · structures</text>
  <text x="250" y="92" font-size="10.5">software_governance</text>
  <text x="250" y="106" font-size="9" font-family="monospace" fill="#666">pgc-governance</text>
  <text x="452" y="99" font-size="9.5" fill="#555">the surface</text>
  <line x1="119" y1="118" x2="119" y2="138" stroke="#1a1a1a" marker-end="url(#m)"/>

  <!-- compile -->
  <rect x="34" y="142" width="170" height="40" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="119" y="160" text-anchor="middle" font-size="11">domain projections</text>
  <text x="119" y="174" text-anchor="middle" font-size="8.5" fill="#666">validated · refused, not repaired</text>
  <text x="250" y="158" font-size="10.5">protocol_compiler</text>
  <text x="250" y="172" font-size="9" font-family="monospace" fill="#666">pgc-compiler</text>
  <text x="452" y="165" font-size="9.5" fill="#555">admissibility</text>
  <line x1="119" y1="184" x2="119" y2="204" stroke="#1a1a1a" marker-end="url(#m)"/>

  <!-- assemble -->
  <rect x="34" y="208" width="170" height="40" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="119" y="226" text-anchor="middle" font-size="11">sealed snapshot</text>
  <text x="119" y="240" text-anchor="middle" font-size="8.5" fill="#666">content-derived identity</text>
  <text x="250" y="224" font-size="10.5">snapshot_assembler</text>
  <text x="250" y="238" font-size="9" font-family="monospace" fill="#666">pgc-assembler</text>
  <text x="452" y="231" font-size="9.5" fill="#555">the seal</text>

  <!-- THE SEAL -->
  <line x1="28" y1="264" x2="548" y2="264" stroke="#1a1a1a" stroke-width="3.5"/>
  <text x="28" y="258" font-size="10" letter-spacing="1.4">SEAL</text>
  <line x1="119" y1="250" x2="119" y2="260" stroke="#1a1a1a" marker-end="url(#m)"/>
  <line x1="119" y1="268" x2="119" y2="288" stroke="#1a1a1a" marker-end="url(#m)"/>

  <!-- execute -->
  <rect x="34" y="292" width="170" height="40" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="119" y="310" text-anchor="middle" font-size="11">governed execution</text>
  <text x="119" y="324" text-anchor="middle" font-size="8.5" fill="#666">traversal only</text>
  <text x="250" y="308" font-size="10.5">protocol_runtime</text>
  <text x="250" y="322" font-size="9" font-family="monospace" fill="#666">pgc-runtime</text>
  <text x="452" y="315" font-size="9.5" fill="#555">nothing</text>
  <line x1="119" y1="334" x2="119" y2="354" stroke="#1a1a1a" marker-end="url(#m)"/>

  <!-- evidence -->
  <rect x="34" y="358" width="170" height="40" fill="#1a1a1a"/>
  <text x="119" y="376" text-anchor="middle" font-size="11" fill="#ffffff">evidence</text>
  <text x="119" y="390" text-anchor="middle" font-size="8.5" fill="#ffffff">admissions · refusals · outcomes</text>
  <text x="250" y="382" font-size="9.5" fill="#666">emitted by every band above</text>

  <!-- side components -->
  <line x1="28" y1="418" x2="548" y2="418" stroke="#c9c9c9"/>
  <text x="28" y="440" font-size="10" letter-spacing="1.2" fill="#888">ACROSS THE FLOW</text>
  <g font-size="10.5">
    <text x="46" y="464">snapshot_inspector</text><text x="250" y="464" font-family="monospace" font-size="9" fill="#666">pgc-inspector</text>
    <text x="380" y="464" font-size="9.5" fill="#555">reads sealed state · never writes</text>
    <text x="46" y="486">transformation</text><text x="250" y="486" font-family="monospace" font-size="9" fill="#666">pgc-transformation</text>
    <text x="380" y="486" font-size="9.5" fill="#555">P0–P8 · derives the successor</text>
    <text x="46" y="508">conformance_workloads</text><text x="250" y="508" font-family="monospace" font-size="9" fill="#666">pgc-workloads</text>
    <text x="380" y="508" font-size="9.5" fill="#555">makes conformance observable</text>
    <text x="46" y="530">business_domains</text><text x="250" y="530" font-family="monospace" font-size="9" fill="#666">pgc-domains</text>
    <text x="380" y="530" font-size="9.5" fill="#555">the domains the snapshot binds</text>
    <text x="46" y="552" fill="#888">protocol_transport</text><text x="250" y="552" font-size="9" fill="#888">— not packaged</text>
    <text x="380" y="552" font-size="9.5" fill="#888">boundary contracts · local only</text>
  </g>

  <!-- the anchor -->
  <line x1="28" y1="578" x2="548" y2="578" stroke="#c9c9c9"/>
  <rect x="28" y="594" width="520" height="68" fill="#fafafa" stroke="#1a1a1a" stroke-dasharray="6 4"/>
  <text x="46" y="616" font-size="11.5">The declarations are not shipped in any wheel.</text>
  <text x="46" y="636" font-size="10" fill="#666">The compiler resolves the governance surface from an anchored repository, so one surface governs a build
</text>
  <text x="46" y="648" font-size="10" fill="#666">rather than a packaged copy competing with it.</text>

  <text x="28" y="688" font-size="12" font-style="italic">Seven governed domains &#183; 410 protocol artifacts &#183; one governance surface, at one pinned revision</text>
  <text x="28" y="710" font-size="10.5" fill="#666">Installing the toolchain is one of two steps; the second is pointing it at the surface that governs the build.</text>
  <text x="28" y="728" font-size="9.5" fill="#888">Repository count, published distributions and artifact totals are version-sensitive; the frozen manifest names the revision.</text>
  </g>
</svg>
