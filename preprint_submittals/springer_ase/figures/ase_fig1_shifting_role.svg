<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 664" width="576" height="664"
     font-family="Helvetica, Arial, sans-serif">
  <rect width="576" height="664" fill="#ffffff"/>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
  </defs>
  <g fill="#1a1a1a">

  <text x="28" y="30" font-size="12" letter-spacing="1.4" fill="#444">THE HUMAN ROLE SHIFTED. THE AUTHORIZATION POINT DID NOT.</text>

  <!-- ===== LEFT: conventional ===== -->
  <text x="28" y="66" font-size="11" letter-spacing="1.2" fill="#666">CONVENTIONAL</text>
  <rect x="28" y="78" width="238" height="290" fill="#fafafa" stroke="#d0d0d0"/>

  <text x="147" y="104" text-anchor="middle" font-size="11.5">producers</text>
  <g font-size="10.5" fill="#555" text-anchor="middle">
    <text x="147" y="124">few — bounded by human capability</text>
    <text x="147" y="140">known — track record can be judged</text>
    <text x="147" y="156">shared tacit context</text>
  </g>
  <circle cx="112" cy="184" r="6" fill="#1a1a1a"/><circle cx="132" cy="184" r="6" fill="#1a1a1a"/>
  <circle cx="152" cy="184" r="6" fill="#1a1a1a"/><circle cx="172" cy="184" r="6" fill="#1a1a1a"/>
  <line x1="147" y1="200" x2="147" y2="222" stroke="#1a1a1a" marker-end="url(#h)"/>

  <rect x="52" y="226" width="190" height="46" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="147" y="246" text-anchor="middle" font-size="12">human review</text>
  <text x="147" y="262" text-anchor="middle" font-size="10" fill="#555">implicit authorization</text>
  <line x1="147" y1="274" x2="147" y2="296" stroke="#1a1a1a" marker-end="url(#h)"/>

  <rect x="52" y="300" width="190" height="32" fill="#1a1a1a"/>
  <text x="147" y="321" text-anchor="middle" font-size="11.5" fill="#ffffff">everything downstream</text>
  <text x="147" y="352" text-anchor="middle" font-size="10.5" fill="#666">review draws its leverage</text>
  <text x="147" y="364" text-anchor="middle" font-size="10.5" fill="#666">from these three conditions</text>

  <!-- ===== RIGHT: agent-mediated ===== -->
  <text x="310" y="66" font-size="10" letter-spacing="0.8" fill="#666">AGENT-MEDIATED — MOTIVATING CASE</text>
  <rect x="310" y="78" width="238" height="290" fill="#ffffff" stroke="#1a1a1a"/>

  <text x="429" y="104" text-anchor="middle" font-size="11.5">producers</text>
  <g font-size="10.5" fill="#555" text-anchor="middle">
    <text x="429" y="124" text-decoration="line-through">few</text>
    <text x="429" y="140" text-decoration="line-through">known</text>
    <text x="429" y="156" text-decoration="line-through">shared tacit context</text>
  </g>
  <g fill="#1a1a1a">
    <circle cx="356" cy="180" r="4"/><circle cx="372" cy="180" r="4"/><circle cx="388" cy="180" r="4"/>
    <circle cx="404" cy="180" r="4"/><circle cx="420" cy="180" r="4"/><circle cx="436" cy="180" r="4"/>
    <circle cx="452" cy="180" r="4"/><circle cx="468" cy="180" r="4"/><circle cx="484" cy="180" r="4"/>
    <circle cx="364" cy="194" r="4"/><circle cx="380" cy="194" r="4"/><circle cx="396" cy="194" r="4"/>
    <circle cx="412" cy="194" r="4"/><circle cx="428" cy="194" r="4"/><circle cx="444" cy="194" r="4"/>
    <circle cx="460" cy="194" r="4"/><circle cx="476" cy="194" r="4"/><circle cx="492" cy="194" r="4"/>
  </g>
  <text x="504" y="190" font-size="10.5" fill="#666">…</text>
  <line x1="429" y1="206" x2="429" y2="222" stroke="#1a1a1a" marker-end="url(#h)"/>

  <rect x="334" y="226" width="190" height="46" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="429" y="246" text-anchor="middle" font-size="12">human review</text>
  <text x="429" y="262" text-anchor="middle" font-size="10" fill="#555">same point · less leverage</text>
  <line x1="429" y1="274" x2="429" y2="296" stroke="#1a1a1a" marker-end="url(#h)"/>

  <rect x="334" y="300" width="190" height="32" fill="#1a1a1a"/>
  <text x="429" y="321" text-anchor="middle" font-size="11.5" fill="#ffffff">everything downstream</text>
  <text x="429" y="352" text-anchor="middle" font-size="10.5" fill="#666">the gate is unchanged;</text>
  <text x="429" y="364" text-anchor="middle" font-size="10.5" fill="#666">the conditions are weaker</text>

  <!-- the shift -->
  <line x1="28" y1="400" x2="548" y2="400" stroke="#c9c9c9"/>
  <text x="28" y="424" font-size="11.5" letter-spacing="1.2" fill="#444">THE ROLE THAT MOVED</text>
  <g font-size="12">
    <text x="44" y="450">producer</text>
    <line x1="112" y1="446" x2="152" y2="446" stroke="#1a1a1a" marker-end="url(#h)"/>
    <text x="164" y="450">director · evaluator · authorizer</text>
  </g>
  <text x="44" y="474" font-size="10.5" fill="#666">The human does less of the producing and more of the deciding.</text>

  <text x="28" y="512" font-size="11.5" letter-spacing="1.2" fill="#444">THE POINT THAT DID NOT</text>
  <text x="44" y="538" font-size="12">Authorization still enters the lifecycle where review happens to occur.</text>
  <text x="44" y="558" font-size="12">Where it is not declared, it cannot be located, checked, or carried.</text>

  <line x1="28" y1="584" x2="548" y2="584" stroke="#c9c9c9"/>
  <text x="28" y="610" font-size="12.5" font-style="italic">The question is not who does the work. It is what makes the</text>
  <text x="28" y="626" font-size="12.5" font-style="italic">resulting behaviour authorized to execute.</text>
  <text x="28" y="650" font-size="9.5" fill="#888">This figure motivates the question. It reports no result; the conditions are argued, not measured.</text>
  </g>
</svg>
