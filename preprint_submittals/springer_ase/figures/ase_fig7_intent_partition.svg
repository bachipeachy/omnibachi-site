<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 756" width="576" height="756"
     font-family="Helvetica, Arial, sans-serif">
  <rect width="576" height="756" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
  </defs>
  <g fill="#1a1a1a">

  <text x="28" y="30" font-size="11.5" letter-spacing="1.5" fill="#444">FOUR CONCERNS, NOT FOUR NAMES FOR ONE SPECIFICATION</text>

  <!-- ===== P5 ===== -->
  <rect x="28" y="48" width="520" height="72" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="46" y="72" font-size="12.5" font-weight="bold">P5 · Business Intent</text>
  <text x="46" y="90" font-size="11" fill="#555">concern: <tspan font-style="italic">business</tspan> — what does the business seek?</text>
  <text x="46" y="108" font-size="9.5" fill="#888">business_objects · identity_semantics · invariants · actions · scope_boundary</text>
  <rect x="470" y="60" width="62" height="24" fill="#f0f0f0" stroke="#bbb"/>
  <text x="501" y="77" text-anchor="middle" font-size="11">8 reg.*</text>

  <!-- the break -->
  <line x1="288" y1="122" x2="288" y2="140" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="120" y1="146" x2="456" y2="146" stroke="#1a1a1a" stroke-width="2"/>
  <text x="288" y="166" text-anchor="middle" font-size="11.5" font-style="italic">the break — no longer one statement</text>
  <text x="288" y="181" text-anchor="middle" font-size="10" fill="#666">what the business wants and what the organization permits separate here</text>
  <line x1="288" y1="188" x2="288" y2="204" stroke="#1a1a1a" stroke-width="2" marker-end="url(#f)"/>

  <!-- ===== P6 ===== -->
  <rect x="28" y="208" width="520" height="72" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="46" y="232" font-size="12.5" font-weight="bold">P6 · Governance Intent</text>
  <text x="46" y="250" font-size="11" fill="#555">concern: <tspan font-style="italic">authority and constraint</tspan> — what is permitted?</text>
  <text x="46" y="268" font-size="9.5" fill="#888">ownership · boundary_rules · storage_governance · governance_outcome</text>
  <rect x="470" y="220" width="62" height="24" fill="#f0f0f0" stroke="#bbb"/>
  <text x="501" y="237" text-anchor="middle" font-size="11">6 reg.*</text>

  <!-- the discharge -->
  <path d="M288,282 L288,300 L112,300 L112,332" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#f)"/>
  <text x="300" y="304" font-size="11.5" font-style="italic">discharged, not merely consulted</text>
  <text x="248" y="319" font-size="8.5" fill="#666">refusal_discharge · refusal_deferrals · refusal_governance_discharge</text>

  <!-- ===== P7 ===== -->
  <rect x="28" y="336" width="520" height="88" fill="#f7f7f7" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="46" y="360" font-size="12.5" font-weight="bold">P7 · Design Intent</text>
  <text x="46" y="378" font-size="11" fill="#555">concern: <tspan font-style="italic">realization structure</tspan> — how must permitted behaviour be structured?</text>
  <text x="46" y="396" font-size="9.5" fill="#888">design_resolution · execution_topology · cc_composition · step_bindings</text>
  <text x="46" y="410" font-size="9.5" fill="#888">implementation_bindings · runtime_policies · structure_stores · … (20 in all)</text>
  <rect x="470" y="348" width="62" height="24" fill="#1a1a1a"/>
  <text x="501" y="365" text-anchor="middle" font-size="11" fill="#ffffff">20 reg.*</text>

  <line x1="288" y1="426" x2="288" y2="450" stroke="#1a1a1a" marker-end="url(#f)"/>
  <text x="300" y="443" font-size="10.5" fill="#666">scheduled, not restated</text>

  <!-- ===== P8 ===== -->
  <rect x="28" y="454" width="520" height="72" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="46" y="478" font-size="12.5" font-weight="bold">P8 · Authoring Mandate</text>
  <text x="46" y="496" font-size="11" fill="#555">concern: <tspan font-style="italic">construction</tspan> — what may be constructed?</text>
  <text x="46" y="514" font-size="9.5" fill="#888">build_order · critical_path — scheduling concerns absent from P7 entirely</text>
  <rect x="470" y="466" width="62" height="24" fill="#f0f0f0" stroke="#bbb"/>
  <text x="501" y="483" text-anchor="middle" font-size="11">7 reg.*</text>

  <!-- the asymmetry -->
  <line x1="28" y1="556" x2="548" y2="556" stroke="#c9c9c9"/>
  <text x="28" y="580" font-size="11.5" letter-spacing="1.2" fill="#444">THE MODEL IS IN THE ARTIFACTS, NOT IMPOSED ON THEM</text>
  <text x="44" y="606" font-size="11.5">P8&#8217;s distinctive registers introduce scheduling concerns P7 does not</text>
  <text x="44" y="622" font-size="11.5">express, and no P8 register reproduces a P7 design register. The mandate</text>
  <text x="44" y="638" font-size="11.5">does not restate the design — it orders what the design determined.</text>

  <line x1="28" y1="664" x2="548" y2="664" stroke="#c9c9c9"/>
  <text x="28" y="690" font-size="12.5" font-style="italic">Natural-language reasoning can traverse all four concerns;</text>
  <text x="28" y="706" font-size="12.5" font-style="italic">it does not thereby acquire authority over any of them.</text>
  <text x="28" y="728" font-size="10.5" fill="#666">An agent may author every register above. Authoring one confers no authority over the concern it records.</text>
  <text x="28" y="746" font-size="9.5" fill="#888">* Register counts are properties of this implementation at the pinned revision, and describe size rather than separation.</text>
  </g>
</svg>
