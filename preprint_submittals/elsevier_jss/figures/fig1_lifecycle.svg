<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t1 d1">
<title id="t1">The PGC lifecycle: three activities over four governed states</title>
<desc id="d1">Purpose is transformed into declarations, declarations are constructed into a sealed snapshot, and the snapshot is executed to produce a result and evidence. The prior snapshot is the baseline for the next transformation.</desc>
<defs><style>.title{font:700 34px Georgia,serif;fill:#173b37}.subtitle{font:400 21px Arial,sans-serif;fill:#46615c}.section{font:700 17px Arial,sans-serif;letter-spacing:2px;fill:#52736d}.head{font:700 27px Arial,sans-serif;fill:#173b37}.body{font:400 19px Arial,sans-serif;fill:#35534e}.note{font:400 18px Arial,sans-serif;fill:#58736e}.box{stroke:#b6cbc5;stroke-width:3}.line{fill:none;stroke:#24655d;stroke-width:5;marker-end:url(#a)}.loop{fill:none;stroke:#bd8d1c;stroke-width:5;stroke-dasharray:14 10;marker-end:url(#g)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#24655d" stroke-width="1.5"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#bd8d1c" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="640" fill="#f7faf8"/>
<text x="80" y="72" class="section">THE LIFECYCLE</text>
<text x="80" y="130" class="title">Three activities, four governed states.</text>
<text x="80" y="170" class="subtitle">Each activity produces the governed input boundary for the next.</text>
<rect x="70" y="250" width="220" height="120" rx="18" fill="#fffdf6" class="box"/>
<text x="180" y="300" text-anchor="middle" class="head">Purpose</text>
<text x="180" y="335" text-anchor="middle" class="note">stated need</text>
<rect x="360" y="250" width="220" height="120" rx="18" fill="#fff" class="box"/>
<text x="470" y="300" text-anchor="middle" class="head">Declarations</text>
<text x="470" y="335" text-anchor="middle" class="note">candidate, then admitted</text>
<rect x="650" y="250" width="220" height="120" rx="18" fill="#e4efec" class="box"/>
<text x="760" y="300" text-anchor="middle" class="head">Snapshot</text>
<text x="760" y="335" text-anchor="middle" class="note">sealed, content-identified</text>
<rect x="940" y="250" width="200" height="120" rx="18" fill="#e4efec" class="box"/>
<text x="1040" y="292" text-anchor="middle" class="head">Result</text>
<text x="1040" y="330" text-anchor="middle" class="note">+ evidence</text>
<path d="M300 310H350" class="line"/><path d="M590 310H640" class="line"/><path d="M880 310H930" class="line"/>
<text x="325" y="232" text-anchor="middle" class="body">transforms</text>
<text x="615" y="232" text-anchor="middle" class="body">constructs</text>
<text x="905" y="232" text-anchor="middle" class="body">executes</text>
<path d="M760 385C760 490 180 490 180 385" class="loop"/>
<text x="600" y="530" text-anchor="middle" class="note">The prior snapshot is the baseline for the next transformation.</text>
<text x="600" y="575" text-anchor="middle" class="body">Evidence informs a later human-directed transformation; it never becomes behavioral authority by itself.</text>
</svg>
