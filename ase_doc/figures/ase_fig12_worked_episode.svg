<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 648" width="576" height="648"
     font-family="Helvetica, Arial, sans-serif">
  <rect width="576" height="648" fill="#ffffff"/>
  <defs>
    <marker id="j" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
  </defs>
  <g fill="#1a1a1a">

  <text x="28" y="24" font-size="11" letter-spacing="1.2" fill="#444">A GOVERNED TRANSFORMATION, PERFORMED BY AN AGENT</text>
  <text x="28" y="40" font-size="9.5" fill="#666">NOVA G4 — the lending need, against a realization the agent had itself built from the specification</text>

  <!-- lanes -->
  <rect x="28" y="52" width="146" height="432" fill="#fafafa" stroke="#d8d8d8"/>
  <rect x="182" y="52" width="200" height="432" fill="#ffffff" stroke="#d8d8d8"/>
  <rect x="390" y="52" width="158" height="432" fill="#fafafa" stroke="#d8d8d8"/>
  <text x="101" y="70" text-anchor="middle" font-size="10" letter-spacing="1.2" fill="#888">HUMAN</text>
  <text x="282" y="70" text-anchor="middle" font-size="10" letter-spacing="1.2" fill="#888">AGENT</text>
  <text x="469" y="70" text-anchor="middle" font-size="10" letter-spacing="1.2" fill="#888">GOVERNANCE</text>

  <!-- 1 need -->
  <rect x="36" y="82" width="130" height="38" fill="#f0f0f0" stroke="#1a1a1a"/>
  <circle cx="50" cy="96" r="5" fill="#1a1a1a"/>
  <text x="60" y="99" font-size="10.5">states the need</text>
  <text x="44" y="113" font-size="9.5" fill="#555">lend a copy to a member</text>
  <path d="M166,101 L182,101" fill="none" stroke="#1a1a1a" marker-end="url(#j)"/>

  <!-- 2 ground -->
  <rect x="190" y="82" width="184" height="46" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="198" y="98" font-size="10.5">grounds in baseline #n</text>
  <text x="198" y="112" font-size="9.5" fill="#555">reads the two baseline artifact</text>
  <text x="198" y="124" font-size="9.5" fill="#555">identities through snapshot_inspector</text>
  <text x="398" y="98" font-size="9.5" fill="#555">snapshot:</text>
  <text x="398" y="111" font-size="9.5" font-family="monospace">70dd9dea…</text>
  <line x1="282" y1="128" x2="282" y2="146" stroke="#1a1a1a" marker-end="url(#j)"/>

  <!-- 3 registers -->
  <rect x="190" y="150" width="184" height="56" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="198" y="166" font-size="10.5">declares four registers</text>
  <text x="198" y="180" font-size="9.5" fill="#555">business need · baseline grounding</text>
  <text x="198" y="192" font-size="9.5" fill="#555">artifact design · build schedule</text>
  <text x="198" y="203" font-size="9" fill="#888">each entry carries an address</text>
  <path d="M374,178 L398,178" fill="none" stroke="#1a1a1a" marker-end="url(#j)"/>

  <!-- governance: sufficiency -->
  <rect x="398" y="150" width="142" height="52" fill="#f0f0f0" stroke="#1a1a1a"/>
  <text x="406" y="167" font-size="10.5">sufficiency</text>
  <text x="406" y="181" font-size="9.5" fill="#555">six declared rules,</text>
  <text x="406" y="193" font-size="9.5" fill="#555">evaluated before realize</text>
  <line x1="469" y1="202" x2="469" y2="218" stroke="#1a1a1a" stroke-dasharray="4 3" marker-end="url(#j)"/>

  <!-- refused -->
  <rect x="398" y="222" width="142" height="46" fill="#1a1a1a"/>
  <text x="469" y="238" text-anchor="middle" font-size="10.5" fill="#ffffff">REFUSED</text>
  <text x="469" y="251" text-anchor="middle" font-size="9" fill="#ffffff">insufficient_design · TR-L4</text>
  <text x="469" y="263" text-anchor="middle" font-size="9" fill="#ffffff">nothing_proceeded = true</text>
  <text x="398" y="281" font-size="9" fill="#888">the fixture removes copy_id</text>
  <text x="398" y="292" font-size="9" fill="#888">from the capability inputs</text>

  <text x="290" y="222" font-size="9.5" fill="#555">sufficient</text>
  <line x1="282" y1="206" x2="282" y2="232" stroke="#1a1a1a" marker-end="url(#j)"/>

  <!-- 4 realize -->
  <rect x="190" y="236" width="184" height="62" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="198" y="252" font-size="10.5">realizes three artifacts</text>
  <text x="198" y="266" font-size="9.5" fill="#555">capability lend-copy-to-member</text>
  <text x="198" y="278" font-size="9.5" fill="#555">workflow · read op · current loan record</text>
  <text x="198" y="291" font-size="9" fill="#888">refusal declared: copy_already_on_loan</text>
  <path d="M374,264 L398,264 L398,320" fill="none" stroke="#1a1a1a" marker-end="url(#j)"/>

  <!-- identities derived -->
  <rect x="398" y="324" width="142" height="46" fill="#f0f0f0" stroke="#1a1a1a"/>
  <text x="406" y="341" font-size="10.5">identities derived</text>
  <text x="406" y="355" font-size="9.5" fill="#555">computed from content —</text>
  <text x="406" y="366" font-size="9.5" fill="#555">never supplied from memory</text>

  <line x1="282" y1="298" x2="282" y2="316" stroke="#1a1a1a" marker-end="url(#j)"/>

  <!-- 5 candidate -->
  <rect x="190" y="320" width="184" height="30" fill="#f0f0f0" stroke="#1a1a1a"/>
  <text x="282" y="339" text-anchor="middle" font-size="10.5">candidate</text>
  <path d="M190,335 L101,335 L101,360" fill="none" stroke="#1a1a1a" marker-end="url(#j)"/>

  <!-- 6 operator adoption -->
  <rect x="36" y="364" width="130" height="44" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6 3"/>
  <circle cx="50" cy="382" r="5" fill="#1a1a1a"/>
  <text x="60" y="385" font-size="10.5" font-weight="bold">operator adoption</text>
  <text x="44" y="399" font-size="9" fill="#555">no callable, no actor check</text>
  <path d="M166,386 L282,386 L282,410" fill="none" stroke="#1a1a1a" marker-end="url(#j)"/>

  <!-- 7 sealed -->
  <rect x="190" y="414" width="184" height="40" fill="#1a1a1a"/>
  <text x="282" y="430" text-anchor="middle" font-size="10.5" fill="#ffffff">baseline #n+1 sealed</text>
  <text x="282" y="445" text-anchor="middle" font-size="9.5" fill="#ffffff" font-family="monospace">48fd5a4d…</text>

  <!-- 8 runtime, below the lanes -->
  <rect x="190" y="496" width="184" height="56" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="198" y="512" font-size="10.5">runtime built from the seal</text>
  <text x="198" y="526" font-size="9.5" fill="#555">records a loan · refuses a second</text>
  <text x="198" y="538" font-size="9.5" fill="#555">loan · reports unloaned status</text>
  <text x="198" y="549" font-size="9" fill="#888">read from recorded state, not asserted</text>
  <line x1="282" y1="454" x2="282" y2="492" stroke="#1a1a1a" marker-end="url(#j)"/>

  <!-- closing -->
  <line x1="28" y1="568" x2="548" y2="568" stroke="#c9c9c9"/>
  <g font-size="10.5">
    <text x="28" y="586">The agent decided: how to model, structure, realize and schedule.</text>
    <text x="28" y="601">It could not decide what was needed, what was permitted, or what became the baseline.</text>
  </g>
  <text x="28" y="620" font-size="10" font-style="italic">Twenty-one demonstrations covered this episode at first delivery; a twenty-second</text>
  <text x="28" y="633" font-size="10" font-style="italic">was added after the §8.4 finding.</text>
  <text x="28" y="645" font-size="8.5" fill="#888">Lanes: HUMAN establishes · AGENT performs · GOVERNANCE determines admissibility. Arrows are observed transitions in this run.</text>
  </g>
</svg>
