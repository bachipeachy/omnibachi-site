<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 738" width="576" height="738"
     font-family="Helvetica, Arial, sans-serif">
  <rect width="576" height="738" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <g font-size="12" fill="#1a1a1a">

  <text x="28" y="26" font-size="11.5" letter-spacing="1.4" fill="#444">AUTHORITY AND ACTIVITY, SEPARATED BY TWO BOUNDARIES</text>

  <!-- ================= HUMAN BAND ================= -->
  <rect x="28" y="44" width="520" height="92" fill="#f4f4f4" stroke="#c9c9c9"/>
  <text x="44" y="66" font-size="10.5" letter-spacing="1.4" fill="#666">HUMAN — DETERMINES</text>
  <circle cx="150" cy="100" r="7" fill="#1a1a1a"/>
  <text x="150" y="123" text-anchor="middle" font-size="12.5">scope</text>
  <circle cx="300" cy="100" r="7" fill="#1a1a1a"/>
  <text x="300" y="123" text-anchor="middle" font-size="12.5">business problem</text>
  <text x="466" y="104" text-anchor="middle" font-size="11" fill="#888" font-style="italic">…returns to adopt</text>

  <!-- ================= BOUNDARY 1 ================= -->
  <line x1="28" y1="160" x2="548" y2="160" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="7 4"/>
  <rect x="150" y="148" width="252" height="24" fill="#ffffff"/>
  <text x="276" y="165" text-anchor="middle" font-size="11" letter-spacing="0.5">the governed transformation boundary</text>
  <text x="548" y="156" font-size="9.5" fill="#888" text-anchor="end">what may be done</text>

  <!-- ================= AGENT BAND ================= -->
  <rect x="28" y="186" width="520" height="230" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="44" y="208" font-size="10.5" letter-spacing="1.4" fill="#666">AGENT — DERIVES</text>

  <rect x="116" y="216" width="344" height="42" fill="#ffffff" stroke="#1a1a1a" stroke-dasharray="5 3"/>
  <text x="288" y="234" text-anchor="middle" font-size="11.5">baseline #n · snapshot_inspector</text>
  <text x="288" y="249" text-anchor="middle" font-size="9.5" fill="#666">sealed, content-addressed · read-only · declared read identities</text>
  <line x1="288" y1="260" x2="288" y2="300" stroke="#1a1a1a" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="298" y="282" font-size="10" font-style="italic" fill="#555">consulted, not consumed</text>

  <g font-size="11">
    <circle cx="80" cy="324" r="6.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="80" y="346" text-anchor="middle">derive</text>
    <circle cx="184" cy="324" r="6.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="184" y="346" text-anchor="middle">analyze</text>
    <circle cx="288" cy="324" r="6.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="288" y="346" text-anchor="middle">design</text>
    <circle cx="392" cy="324" r="6.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="392" y="346" text-anchor="middle">construct</text>
    <circle cx="496" cy="324" r="6.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="496" y="346" text-anchor="middle">transform</text>
  </g>
  <line x1="87" y1="324" x2="177" y2="324" stroke="#c9c9c9"/>
  <line x1="191" y1="324" x2="281" y2="324" stroke="#c9c9c9"/>
  <line x1="295" y1="324" x2="385" y2="324" stroke="#c9c9c9"/>
  <line x1="399" y1="324" x2="489" y2="324" stroke="#c9c9c9"/>
  <text x="288" y="370" text-anchor="middle" font-size="9.5" fill="#888">The row is a summary of what an agent may do — not a dependency graph, and not an order.</text>
  <text x="288" y="396" text-anchor="middle" font-size="11.5" font-style="italic" fill="#555">powerful inside construction · powerless over the boundary</text>

  <!-- candidate -->
  <line x1="288" y1="416" x2="288" y2="428" stroke="#1a1a1a" marker-end="url(#a)"/>
  <text x="288" y="446" text-anchor="middle" font-size="11.5">candidate — a proposal to the boundary, not an extension of it</text>

  <!-- ================= PROMOTE ================= -->
  <line x1="288" y1="452" x2="288" y2="464" stroke="#1a1a1a" marker-end="url(#a)"/>
  <rect x="120" y="468" width="336" height="54" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="6 3"/>
  <circle cx="148" cy="495" r="7" fill="#1a1a1a"/>
  <text x="168" y="491" font-size="13">operator adoption</text>
  <text x="168" y="508" font-size="9.5" fill="#666">no callable, no actor check in this realization (&#167;5.5)</text>

  <!-- ================= THE SEAL ================= -->
  <line x1="288" y1="524" x2="288" y2="548" stroke="#1a1a1a" marker-end="url(#a)"/>
  <line x1="28" y1="556" x2="548" y2="556" stroke="#1a1a1a" stroke-width="4"/>
  <text x="44" y="548" font-size="12" letter-spacing="1.6">SEAL</text>
  <text x="548" y="574" font-size="9.5" fill="#888" text-anchor="end">nothing below determines behaviour</text>

  <!-- ================= RUNTIME ================= -->
  <rect x="28" y="590" width="520" height="94" fill="#ffffff" stroke="#c9c9c9"/>
  <text x="44" y="612" font-size="10.5" letter-spacing="1.4" fill="#666">RUNTIME — REALIZES</text>
  <text x="288" y="642" text-anchor="middle" font-size="13">executable state</text>
  <text x="288" y="666" text-anchor="middle" font-size="11.5" fill="#555" font-style="italic">no agent · no authority · traversal only</text>

  <!-- legend -->
  <circle cx="308" cy="704" r="6" fill="#1a1a1a"/>
  <text x="322" y="708" font-size="10.5" fill="#555">human act</text>
  <circle cx="410" cy="704" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="424" y="708" font-size="10.5" fill="#555">agent may derive</text>
  <text x="28" y="722" font-size="8.5" fill="#888">Solid = implemented mechanism. Dashed = architectural intent or a deployment act,</text>
  <text x="28" y="733" font-size="8.5" fill="#888">not enforced in this realization. &#167;8 reports what was observed.</text>
  </g>
</svg>
