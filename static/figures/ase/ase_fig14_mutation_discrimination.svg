<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 470" width="576" height="470"
     font-family="Helvetica, Arial, sans-serif">
  <rect width="576" height="470" fill="#ffffff"/>
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
  </defs>
  <g fill="#1a1a1a">

  <text x="28" y="28" font-size="11.5" letter-spacing="1.4" fill="#444">WHETHER A DEMONSTRATION COULD HAVE FAILED</text>

  <!-- ===== A: non-discriminating ===== -->
  <text x="28" y="60" font-size="10.5" letter-spacing="1.2" fill="#888">NON-DISCRIMINATING</text>
  <rect x="28" y="70" width="248" height="150" fill="#fafafa" stroke="#d0d0d0"/>
  <rect x="44" y="86" width="100" height="26" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="94" y="103" text-anchor="middle" font-size="10">conforming</text>
  <rect x="44" y="122" width="100" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-dasharray="4 3"/>
  <text x="94" y="139" text-anchor="middle" font-size="10">mutated</text>
  <line x1="146" y1="99" x2="176" y2="112" stroke="#1a1a1a" marker-end="url(#n)"/>
  <line x1="146" y1="135" x2="176" y2="122" stroke="#1a1a1a" marker-end="url(#n)"/>
  <rect x="180" y="102" width="80" height="30" fill="#f0f0f0" stroke="#1a1a1a"/>
  <text x="220" y="121" text-anchor="middle" font-size="10">PASS</text>
  <text x="152" y="172" text-anchor="middle" font-size="9.5" fill="#555">both reach the same outcome</text>
  <text x="152" y="188" text-anchor="middle" font-size="10" font-style="italic">the property is not evidenced</text>
  <text x="152" y="206" text-anchor="middle" font-size="9" fill="#666">the demonstration could not have failed</text>

  <!-- ===== B: discriminating ===== -->
  <text x="300" y="60" font-size="10.5" letter-spacing="1.2" fill="#888">DISCRIMINATING</text>
  <rect x="300" y="70" width="248" height="150" fill="#ffffff" stroke="#1a1a1a"/>
  <rect x="316" y="86" width="100" height="26" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="366" y="103" text-anchor="middle" font-size="10">conforming</text>
  <rect x="316" y="122" width="100" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-dasharray="4 3"/>
  <text x="366" y="139" text-anchor="middle" font-size="10">mutated</text>
  <line x1="418" y1="99" x2="448" y2="99" stroke="#1a1a1a" marker-end="url(#n)"/>
  <line x1="418" y1="135" x2="448" y2="135" stroke="#1a1a1a" marker-end="url(#n)"/>
  <rect x="452" y="86" width="80" height="26" fill="#f0f0f0" stroke="#1a1a1a"/>
  <text x="492" y="103" text-anchor="middle" font-size="10">PASS</text>
  <rect x="452" y="122" width="80" height="26" fill="#1a1a1a"/>
  <text x="492" y="139" text-anchor="middle" font-size="10" fill="#ffffff">FAIL</text>
  <text x="424" y="172" text-anchor="middle" font-size="9.5" fill="#555">the outcomes separate</text>
  <text x="424" y="188" text-anchor="middle" font-size="10" font-style="italic">the property is evidenced</text>
  <text x="424" y="206" text-anchor="middle" font-size="9" fill="#666">removing the guard changes the result</text>

  <!-- the finding -->
  <line x1="28" y1="244" x2="548" y2="244" stroke="#c9c9c9"/>
  <text x="28" y="266" font-size="10.5" letter-spacing="1.2" fill="#888">WHAT SEPARATED THE TWO GROUPS</text>
  <text x="44" y="292" font-size="11">When the risk was stated explicitly — <tspan font-style="italic">could routing be hard-coded without</tspan></text>
  <text x="44" y="308" font-size="11"><tspan font-style="italic">detection?</tspan> — the discriminating demonstration was constructed.</text>
  <text x="44" y="330" font-size="11">When that risk was left implicit, existing evidence did not expose it.</text>
  <text x="44" y="354" font-size="10" fill="#666">No suite test, inspection, or evidence document made the earlier gaps visible.</text>

  <line x1="28" y1="380" x2="548" y2="380" stroke="#c9c9c9"/>
  <rect x="28" y="394" width="520" height="30" fill="#1a1a1a"/>
  <text x="288" y="414" text-anchor="middle" font-size="12.5" fill="#ffffff">A passing suite is not evidence that a demonstration could fail.</text>
  <text x="28" y="450" font-size="10" fill="#666">Risk-directed, not systematic; no mutation score is reported. This measures the adequacy of specific</text>
  <text x="28" y="462" font-size="10" fill="#666">demonstrations, not coverage of the suite.</text>
  </g>
</svg>
