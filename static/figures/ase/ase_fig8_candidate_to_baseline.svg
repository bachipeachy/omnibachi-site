<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 670" width="576" height="670"
     font-family="Helvetica, Arial, sans-serif">
  <rect width="576" height="670" fill="#ffffff"/>
  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
  </defs>
  <g fill="#1a1a1a">

  <text x="28" y="30" font-size="11.5" letter-spacing="1.5" fill="#444">THREE RESPONSIBILITIES, DELIBERATELY NOT FUSED</text>

  <!-- lane labels -->
  <g font-size="10" letter-spacing="1.2" fill="#888">
    <text x="30" y="86">AGENT</text>
    <text x="30" y="250">GOVERNANCE</text>
    <text x="30" y="392">OPERATOR</text>
    <text x="30" y="524">SEALED STATE</text>
  </g>
  <line x1="132" y1="60" x2="132" y2="600" stroke="#e0e0e0"/>

  <!-- 1 · construction -->
  <rect x="152" y="62" width="392" height="46" fill="#ffffff" stroke="#1a1a1a"/>
  <circle cx="176" cy="85" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
  <text x="196" y="82" font-size="13">construction</text>
  <text x="196" y="98" font-size="10.5" fill="#666">renders the admitted mandate — produces no authorization</text>
  <line x1="348" y1="110" x2="348" y2="132" stroke="#1a1a1a" marker-end="url(#d)"/>

  <rect x="212" y="136" width="272" height="42" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="348" y="154" text-anchor="middle" font-size="13">candidate</text>
  <text x="348" y="170" text-anchor="middle" font-size="10.5" fill="#555">a proposal to the boundary — not an extension of it</text>

  <!-- the break: construction ends here -->
  <line x1="152" y1="200" x2="544" y2="200" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="6 4"/>
  <rect x="252" y="190" width="192" height="20" fill="#ffffff"/>
  <text x="348" y="205" text-anchor="middle" font-size="11" font-style="italic">construction ends here</text>
  <line x1="348" y1="178" x2="348" y2="196" stroke="#1a1a1a" marker-end="url(#d)"/>

  <!-- 2 · admissibility -->
  <line x1="348" y1="212" x2="348" y2="230" stroke="#1a1a1a" marker-end="url(#d)"/>
  <rect x="152" y="234" width="392" height="46" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="176" y="254" font-size="13">admissibility</text>
  <text x="176" y="270" font-size="10.5" fill="#666">protocol compilation — admitted, or refused rather than repaired</text>
  <line x1="348" y1="282" x2="348" y2="304" stroke="#1a1a1a" marker-end="url(#d)"/>
  <text x="360" y="298" font-size="10.5" fill="#666">admitted — still not authorized</text>

  <!-- 3 · promotion -->
  <rect x="152" y="330" width="392" height="56" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="2.2" stroke-dasharray="7 4"/>
  <circle cx="176" cy="358" r="7" fill="#1a1a1a"/>
  <text x="196" y="353" font-size="13.5" font-weight="bold">operator adoption</text>
  <text x="196" y="371" font-size="10.5" fill="#555">no callable, no actor check in this realization</text>
  <line x1="348" y1="388" x2="348" y2="412" stroke="#1a1a1a" marker-end="url(#d)"/>

  <!-- 4 · seal -->
  <rect x="212" y="416" width="272" height="42" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="348" y="434" text-anchor="middle" font-size="13">seal</text>
  <text x="348" y="450" text-anchor="middle" font-size="10.5" fill="#666">enforced against admission</text>
  <line x1="348" y1="460" x2="348" y2="482" stroke="#1a1a1a" marker-end="url(#d)"/>

  <rect x="212" y="486" width="272" height="42" fill="#1a1a1a"/>
  <text x="348" y="513" text-anchor="middle" font-size="14" fill="#ffffff">baseline #n+1</text>

  <!-- closing -->
  <line x1="28" y1="556" x2="548" y2="556" stroke="#c9c9c9"/>
  <text x="28" y="580" font-size="12.5" font-style="italic">Producing a candidate system is not the same act as authorizing it</text>
  <text x="28" y="596" font-size="12.5" font-style="italic">to become the next baseline.</text>
  <text x="28" y="620" font-size="10.5" fill="#666">Fusing promotion to construction would make the builder the authority.</text>
  <text x="28" y="644" font-size="9.5" fill="#888">Enforcement: admission and sealing are enforced by the toolchain. Promotion is an operator act — no callable</text>
  <text x="28" y="657" font-size="9.5" fill="#888">performs it and no actor check gates it, so it is a deployment property rather than an enforced transition (&#167;5.5).</text>
  </g>
</svg>
