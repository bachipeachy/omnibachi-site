<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 470" width="1020" height="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1020" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>

  <!-- function bands -->
  <text x="120" y="30" font-size="15" font-style="italic" text-anchor="middle">𝒯 transformation</text>
  <text x="455" y="30" font-size="15" font-style="italic" text-anchor="middle">𝒞 compilation</text>
  <text x="880" y="30" font-size="15" font-style="italic" text-anchor="middle">Φ execution</text>
  <line x1="30" y1="42" x2="210" y2="42" stroke="#111" stroke-width="1"/>
  <line x1="245" y1="42" x2="665" y2="42" stroke="#111" stroke-width="1"/>
  <line x1="790" y1="42" x2="990" y2="42" stroke="#111" stroke-width="1"/>
  <text x="120" y="60" font-size="12" fill="#444" text-anchor="middle">(Bₙ, P) → Bₙ₊₁</text>
  <text x="455" y="60" font-size="12" fill="#444" text-anchor="middle">Bₙ₊₁ → Sₙ₊₁</text>
  <text x="880" y="60" font-size="12" fill="#444" text-anchor="middle">Sₙ₊₁ → (R, T)</text>

  <!-- transformation (deferred) -->
  <rect x="30" y="150" width="180" height="150" fill="#f4f4f4" stroke="#111" stroke-width="1"/>
  <text x="120" y="180" font-size="14" text-anchor="middle">governed</text>
  <text x="120" y="199" font-size="14" text-anchor="middle">transformation</text>
  <text x="120" y="228" font-size="12" fill="#444" text-anchor="middle">a named predecessor</text>
  <text x="120" y="245" font-size="12" fill="#444" text-anchor="middle">and a proposal become</text>
  <text x="120" y="262" font-size="12" fill="#444" text-anchor="middle">authored artifacts</text>
  <text x="120" y="286" font-size="11" fill="#666" font-style="italic" text-anchor="middle">not examined here</text>

  <!-- authored material -->
  <rect x="245" y="120" width="175" height="62" fill="#fff" stroke="#111"/>
  <text x="332" y="146" font-size="13" text-anchor="middle">governance surface</text>
  <text x="332" y="165" font-size="11" fill="#444" text-anchor="middle">rules · closed capability set</text>

  <rect x="245" y="194" width="175" height="62" fill="#fff" stroke="#111"/>
  <text x="332" y="220" font-size="13" text-anchor="middle">business domains</text>
  <text x="332" y="239" font-size="11" fill="#444" text-anchor="middle">declarations per domain</text>

  <rect x="245" y="268" width="175" height="62" fill="#fff" stroke="#111"/>
  <text x="332" y="294" font-size="13" text-anchor="middle">conformance workload</text>
  <text x="332" y="313" font-size="11" fill="#444" text-anchor="middle">admitted by the same path</text>

  <line x1="210" y1="225" x2="240" y2="225" stroke="#111" marker-end="url(#a)"/>

  <!-- compiler + assembler -->
  <rect x="455" y="150" width="120" height="150" fill="#fff" stroke="#111"/>
  <text x="515" y="215" font-size="13" text-anchor="middle">protocol</text>
  <text x="515" y="233" font-size="13" text-anchor="middle">compiler</text>
  <text x="515" y="258" font-size="11" fill="#444" text-anchor="middle">admits</text>
  <text x="515" y="274" font-size="11" fill="#444" text-anchor="middle">or refuses</text>

  <rect x="600" y="150" width="120" height="150" fill="#fff" stroke="#111"/>
  <text x="660" y="215" font-size="13" text-anchor="middle">snapshot</text>
  <text x="660" y="233" font-size="13" text-anchor="middle">assembler</text>
  <text x="660" y="258" font-size="11" fill="#444" text-anchor="middle">composes</text>
  <text x="660" y="274" font-size="11" fill="#444" text-anchor="middle">and seals</text>

  <line x1="420" y1="225" x2="450" y2="225" stroke="#111" marker-end="url(#a)"/>
  <line x1="575" y1="225" x2="596" y2="225" stroke="#111" marker-end="url(#a)"/>

  <!-- snapshot -->
  <rect x="745" y="150" width="130" height="150" fill="#e8e8e8" stroke="#111" stroke-width="2"/>
  <text x="810" y="200" font-size="14" font-weight="bold" text-anchor="middle">snapshot</text>
  <text x="810" y="222" font-size="13" text-anchor="middle">Sₙ₊₁</text>
  <text x="810" y="250" font-size="11" fill="#444" text-anchor="middle">sealed</text>
  <text x="810" y="266" font-size="11" fill="#444" text-anchor="middle">content identity</text>
  <line x1="720" y1="225" x2="741" y2="225" stroke="#111" marker-end="url(#a)"/>

  <!-- runtime -->
  <rect x="900" y="150" width="95" height="150" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="947" y="205" font-size="13" text-anchor="middle">runtime</text>
  <text x="947" y="230" font-size="11" fill="#444" text-anchor="middle">fixed</text>
  <text x="947" y="246" font-size="11" fill="#444" text-anchor="middle">domain-</text>
  <text x="947" y="262" font-size="11" fill="#444" text-anchor="middle">neutral</text>
  <line x1="875" y1="225" x2="896" y2="225" stroke="#111" marker-end="url(#a)"/>

  <!-- substrate boundary -->
  <line x1="888" y1="95" x2="888" y2="400" stroke="#111" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="888" y="88" font-size="12" font-style="italic" text-anchor="middle">substrate boundary</text>

  <!-- carried-by labels -->
  <text x="500" y="370" font-size="12" font-style="italic" text-anchor="middle">carried by the artifact — changes when a domain is admitted</text>
  <line x1="245" y1="345" x2="875" y2="345" stroke="#888"/>
  <text x="947" y="370" font-size="12" font-style="italic" text-anchor="middle">does not</text>
  <line x1="900" y1="345" x2="995" y2="345" stroke="#888"/>

  <!-- outputs -->
  <text x="947" y="415" font-size="12" text-anchor="middle">result R</text>
  <text x="947" y="433" font-size="12" text-anchor="middle">trace T</text>
  <line x1="947" y1="300" x2="947" y2="398" stroke="#111" marker-end="url(#a)"/>

  <!-- refusal -->
  <text x="515" y="120" font-size="11" fill="#444" text-anchor="middle">refusal names the rule</text>
  <line x1="515" y1="128" x2="515" y2="146" stroke="#111" stroke-dasharray="3 3" marker-end="url(#a)"/>
</svg>
