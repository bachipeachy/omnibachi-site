<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t3 d3">
<title id="t3">Traversal without decision</title>
<desc id="d3">The runtime reads the sealed representation to reach a workflow, a capability, its governing contract and a declared effect surface. Routing is data: a capability computes which declared outcome obtains, and an unrouted outcome refuses.</desc>
<defs><style>.title{font:700 34px Georgia,serif;fill:#173b37}.subtitle{font:400 21px Arial,sans-serif;fill:#46615c}.section{font:700 17px Arial,sans-serif;letter-spacing:2px;fill:#52736d}.head{font:700 27px Arial,sans-serif;fill:#173b37}.body{font:400 19px Arial,sans-serif;fill:#35534e}.note{font:400 18px Arial,sans-serif;fill:#58736e}.box{stroke:#b6cbc5;stroke-width:3}.line{fill:none;stroke:#24655d;stroke-width:5;marker-end:url(#a)}.loop{fill:none;stroke:#bd8d1c;stroke-width:5;stroke-dasharray:14 10;marker-end:url(#g)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#24655d" stroke-width="1.5"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#bd8d1c" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="560" fill="#f7faf8"/>
<text x="80" y="72" class="section">EXECUTION</text>
<text x="80" y="130" class="title">Traversal reads declared structure. It decides nothing.</text>
<text x="80" y="170" class="subtitle">A capability computes which declared outcome obtains; the runtime reads routing for that outcome.</text>
<rect x="55" y="250" width="215" height="110" rx="16" fill="#e4efec" class="box"/>
<text x="162" y="298" text-anchor="middle" class="head">Sealed</text>
<text x="162" y="330" text-anchor="middle" class="head">representation</text>
<rect x="315" y="250" width="180" height="110" rx="16" fill="#fff" class="box"/>
<text x="405" y="315" text-anchor="middle" class="head">Workflow</text>
<rect x="540" y="250" width="180" height="110" rx="16" fill="#fff" class="box"/>
<text x="630" y="315" text-anchor="middle" class="head">Capability</text>
<rect x="765" y="250" width="180" height="110" rx="16" fill="#fff" class="box"/>
<text x="855" y="315" text-anchor="middle" class="head">Contract</text>
<rect x="990" y="250" width="160" height="110" rx="16" fill="#fffdf6" class="box"/>
<text x="1070" y="315" text-anchor="middle" class="head">Effect</text>
<path d="M280 305H305" class="line"/><path d="M505 305H530" class="line"/><path d="M730 305H755" class="line"/><path d="M955 305H980" class="line"/>
<text x="600" y="440" text-anchor="middle" class="body">Routing is data. It is never computed from payload, caller, environment, accumulated state, or a runtime search.</text>
<text x="600" y="480" text-anchor="middle" class="body">An unrouted outcome, an unresolved reference, a missing declaration: each refuses.</text>
<text x="600" y="522" text-anchor="middle" class="note">No step is added, removed, or rerouted while the run is in progress.</text>
</svg>
