<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="t2 d2">
<title id="t2">The governed transition and its five properties</title>
<desc id="d2">A proposal against a governed state is evaluated over the applicable closure, yielding a successor state and evidence. The determination admits, constrains or refuses. Five properties hold: priority, totality, closure completeness, boundedness and evidence.</desc>
<defs><style>.title{font:700 34px Georgia,serif;fill:#173b37}.subtitle{font:400 20px Arial,sans-serif;fill:#46615c}.section{font:700 17px Arial,sans-serif;letter-spacing:2px;fill:#52736d}.head{font:700 26px Arial,sans-serif;fill:#173b37}.body{font:400 19px Arial,sans-serif;fill:#35534e}.note{font:400 18px Arial,sans-serif;fill:#58736e}.box{stroke:#b6cbc5;stroke-width:3}.line{fill:none;stroke:#24655d;stroke-width:5;marker-end:url(#a)}.loop{fill:none;stroke:#bd8d1c;stroke-width:5;stroke-dasharray:14 10;marker-end:url(#g)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#24655d" stroke-width="1.5"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#bd8d1c" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="820" fill="#f7faf8"/>
<text x="80" y="72" class="section">THE GOVERNED TRANSITION</text>
<text x="80" y="128" class="title">Determination completes before the change.</text>
<text x="80" y="168" class="subtitle">Refusal is an outcome of the schema, not a failure of it.</text>
<rect x="90" y="250" width="250" height="130" rx="18" fill="#e4efec" class="box"/>
<text x="215" y="300" text-anchor="middle" class="head">Governed state S</text>
<text x="215" y="337" text-anchor="middle" class="note">complete for its closure</text>
<rect x="475" y="250" width="250" height="130" rx="18" fill="#fffdf6" class="box"/>
<text x="600" y="300" text-anchor="middle" class="head">Proposal π</text>
<text x="600" y="337" text-anchor="middle" class="note">not yet an effect</text>
<rect x="860" y="250" width="250" height="130" rx="18" fill="#e4efec" class="box"/>
<text x="985" y="300" text-anchor="middle" class="head">S′ + ε</text>
<text x="985" y="337" text-anchor="middle" class="note">admit · constrain · refuse</text>
<path d="M350 315H465" class="line"/><path d="M735 315H850" class="line"/>
<rect x="440" y="440" width="320" height="120" rx="18" fill="#173b37"/>
<text x="600" y="492" text-anchor="middle" style="font:700 26px Arial,sans-serif;fill:#fff">determine(S, π, C)</text>
<text x="600" y="530" text-anchor="middle" style="font:400 18px Arial,sans-serif;fill:#e8f0ee">closure C · complete evaluation</text>
<path d="M600 385V430" class="line"/>
<text x="60" y="590" class="section">FIVE PROPERTIES — DEFINED IN §3.2</text><rect x="60" y="625" width="118" height="58" rx="14" fill="#e4efec" class="box"/><text x="119" y="662" text-anchor="middle" style="font:700 18px Arial,sans-serif;fill:#173b37">Priority</text><rect x="194" y="625" width="118" height="58" rx="14" fill="#e4efec" class="box"/><text x="253" y="662" text-anchor="middle" style="font:700 18px Arial,sans-serif;fill:#173b37">Totality</text><rect x="328" y="625" width="250" height="58" rx="14" fill="#e4efec" class="box"/><text x="453" y="662" text-anchor="middle" style="font:700 18px Arial,sans-serif;fill:#173b37">Closure completeness</text><rect x="594" y="625" width="151" height="58" rx="14" fill="#e4efec" class="box"/><text x="670" y="662" text-anchor="middle" style="font:700 18px Arial,sans-serif;fill:#173b37">Boundedness</text><rect x="761" y="625" width="118" height="58" rx="14" fill="#e4efec" class="box"/><text x="820" y="662" text-anchor="middle" style="font:700 18px Arial,sans-serif;fill:#173b37">Evidence</text><text x="60" y="740" class="body">Every one must hold for a transition to be governed. A transition missing any of them is a change that happened,</text><text x="60" y="775" class="body">not a determination that was made.</text></svg>
