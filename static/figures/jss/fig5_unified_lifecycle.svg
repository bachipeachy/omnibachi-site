<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" role="img" aria-labelledby="title desc">
<title id="title">The unified PGC lifecycle: one transition pattern, three activities, separate authorities</title><desc id="desc">One governed transition schema, determine of S with proposal pi over closure C, yielding a successor state and evidence. Transformation, construction and execution are three instances of that schema over different subjects, each holding a different authority. The prior snapshot is the baseline for the next transformation.</desc>
<defs><style>.title{font:700 36px Georgia,serif;fill:#173b37}.subtitle{font:400 22px Arial,sans-serif;fill:#46615c}.section{font:700 18px Arial,sans-serif;letter-spacing:2px;fill:#52736d}.head{font:700 29px Arial,sans-serif;fill:#173b37}.body{font:400 20px Arial,sans-serif;fill:#35534e}.note{font:400 20px Arial,sans-serif;fill:#58736e}.box{stroke:#b6cbc5;stroke-width:3}.line{fill:none;stroke:#24655d;stroke-width:5;marker-end:url(#a)}.loop{fill:none;stroke:#bd8d1c;stroke-width:5;stroke-dasharray:14 10;marker-end:url(#g)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#24655d" stroke-width="1.5"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#bd8d1c" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="1800" fill="#f7faf8"/><text x="80" y="90" class="section">THE MODEL</text><text x="80" y="155" class="title">One pattern, three activities, separate authorities.</text><text x="80" y="198" class="subtitle">The semantics is shared; the authority each activity holds is not. They compose, they do not collapse.</text>
<text x="120" y="320" class="section">THE GOVERNED TRANSITION</text><rect x="120" y="390" width="260" height="150" rx="18" fill="#e4efec" class="box"/><text x="250" y="445" text-anchor="middle" class="head">Governed state S</text><text x="250" y="482" text-anchor="middle" class="body">complete for its closure</text><text x="250" y="515" text-anchor="middle" class="note">the current baseline</text>
<rect x="470" y="390" width="260" height="150" rx="18" fill="#fffdf6" class="box"/><text x="600" y="445" text-anchor="middle" class="head">Proposal π</text><text x="600" y="482" text-anchor="middle" class="body">candidate change</text><text x="600" y="515" text-anchor="middle" class="note">not yet an effect</text>
<rect x="820" y="390" width="260" height="150" rx="18" fill="#e4efec" class="box"/><text x="950" y="445" text-anchor="middle" class="head">State S′ + ε</text><text x="950" y="482" text-anchor="middle" class="body">result and evidence</text><text x="950" y="515" text-anchor="middle" class="note">admit, constrain, refuse</text>
<path d="M390 465H460" class="line"/><path d="M740 465H810" class="line"/><rect x="440" y="610" width="320" height="130" rx="18" fill="#173b37"/><text x="600" y="665" text-anchor="middle" style="font:700 28px Arial,sans-serif;fill:#fff">determine(S, π, C)</text><text x="600" y="705" text-anchor="middle" style="font:400 19px Arial,sans-serif;fill:#e8f0ee">closure C · complete evaluation</text><path d="M600 545V600" class="line"/>
<text x="120" y="890" class="section">THE PGC LIFECYCLE</text><rect x="120" y="960" width="280" height="155" rx="18" fill="#fff" class="box"/><text x="260" y="1015" text-anchor="middle" class="head">Transformation</text><text x="260" y="1053" text-anchor="middle" class="body">from purpose</text><text x="260" y="1085" text-anchor="middle" class="note">determines the declarations</text>
<rect x="460" y="960" width="280" height="155" rx="18" fill="#fff" class="box"/><text x="600" y="1015" text-anchor="middle" class="head">Construction</text><text x="600" y="1053" text-anchor="middle" class="body">from declarations</text><text x="600" y="1085" text-anchor="middle" class="note">determines what may execute</text>
<rect x="800" y="960" width="280" height="155" rx="18" fill="#fff" class="box"/><text x="940" y="1015" text-anchor="middle" class="head">Execution</text><text x="940" y="1053" text-anchor="middle" class="body">from the snapshot</text><text x="940" y="1085" text-anchor="middle" class="note">determines what occurs</text>
<path d="M410 1037H450" class="line"/><path d="M750 1037H790" class="line"/><path d="M940 1140C940 1280 260 1280 260 1140" class="loop"/><text x="600" y="1280" text-anchor="middle" class="note">The prior snapshot is the baseline for transformation; evidence is retained for each activity.</text>
<rect x="120" y="1400" width="960" height="190" rx="22" fill="#e4efec" class="box"/><text x="160" y="1455" class="head">Authority chain</text><text x="160" y="1510" class="body">governance → declarations → construction → authorized snapshot → execution</text><text x="160" y="1550" class="note">Construction determines what may be executed. Execution realizes what the snapshot determines.</text>
</svg>